# ==============================================================================
# Umbriel Wayland Compositor Default Configuration
# Live reloaded on file save
# ==============================================================================

[general]
autostart = ["noctalia"]

[input.keyboard]
layout = "us"
numlock_toggle = true

[input.touchpad]
tap = true

# Only overrides are listed here; everything else comes from Umbriel's built-in
# defaults (workspaces 1-9, window move/focus directions, etc.).
[keybinds]
# Launchers & Terminals
"Mod+Return" = { action = "spawn:ghostty", repeat = false }
"Mod+Space"  = "spawn:noctalia msg panel-toggle launcher"

# Session & Windows
"Mod+Q"      = { action = "window-close", repeat = false }
"Mod+Escape" = "session-quit"

# Default Noctalia Audio IPC Integrations
"XF86AudioRaiseVolume" = { action = "spawn:noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute"        = { action = "spawn:noctalia msg volume-mute", allow_when_locked = true, repeat = false }

# Focus Navigation & Window Movement: provided by Umbriel's built-in defaults.

# Layout
"Mod+F" = "window-fullscreen-toggle"
"Mod+V" = "window-floating-toggle"
