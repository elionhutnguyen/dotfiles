# High Performance Video Output & GPU Decoding
vo=gpu-next
gpu-context=wayland
gpu-api=vulkan
hwdec=auto-safe

# Quality & Scaling (Sharp without draining laptop battery)
profile=gpu-hq
scale=spline36
cscale=spline36
dscale=mitchell
dither-depth=auto

# Subtitles (Prioritize English, Vietnamese, Traditional Chinese)
sub-auto=fuzzy
sub-font="Noto Sans CJK TC"
sub-font-size=44
sub-border-size=2.5
sub-shadow-offset=1
sub-shadow-color="#000000"
slang=en,eng,vi,zh,zh-TW

# Audio (Default to Japanese / English)
alang=ja,jp,jpn,en,eng
volume=100
volume-max=150

# Playback Behavior & Cache
save-position-on-quit=yes
keep-open=yes
cache=yes
demuxer-max-bytes=200MiB
demuxer-max-back-bytes=100MiB

# yt-dlp Integration (Default to 1080p max to save bandwidth & GPU)
ytdl-format="bestvideo[height<=?1080]+bestaudio/best"

# Screenshots
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-directory="~/Pictures/Screenshots"
screenshot-template="mpv_%Y-%m-%d_%H-%M-%S"
