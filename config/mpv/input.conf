# Seeking
RIGHT       seek  5
LEFT        seek -5
UP          seek  30
DOWN        seek -30
Ctrl+RIGHT  seek  60
Ctrl+LEFT   seek -60

# Volume & Audio
WHEEL_UP    add volume  2
WHEEL_DOWN  add volume -2
k           cycle audio
m           cycle mute

# Subtitles
j           cycle sub
v           cycle sub-visibility
J           cycle sub down

# Playback Control
SPACE       cycle pause
[           multiply speed 1/1.1
]           multiply speed 1.1
BS          set speed 1.0

# Window & Screenshot
f           cycle fullscreen
s           screenshot
S           screenshot video
q           quit
