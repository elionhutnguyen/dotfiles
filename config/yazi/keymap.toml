[manager]
keymap = [
  # Vim-like Navigation
  { on = [ "k" ], run = "arrow -1", desc = "Cursor up" },
  { on = [ "j" ], run = "arrow 1",  desc = "Cursor down" },
  { on = [ "h" ], run = "leave",    desc = "Parent directory" },
  { on = [ "l" ], run = "enter",    desc = "Enter directory / Open file" },

  # Fast Navigation
  { on = [ "g", "g" ], run = "arrow -99999999", desc = "Go to top" },
  { on = [ "G" ],      run = "arrow 99999999",  desc = "Go to bottom" },
  { on = [ "g", "h" ], run = "cd ~",             desc = "Go to home" },
  { on = [ "g", "d" ], run = "cd ~/dotfiles",    desc = "Go to dotfiles" },

  # Search & Filter
  { on = [ "/" ], run = "find",        desc = "Find in directory" },
  { on = [ "f" ], run = "filter --smart", desc = "Filter files" },

  # File Operations
  { on = [ "y" ], run = "yank",        desc = "Copy file" },
  { on = [ "x" ], run = "yank --cut",  desc = "Cut file" },
  { on = [ "p" ], run = "paste",       desc = "Paste file" },
  { on = [ "d" ], run = "remove",      desc = "Delete file" },
  { on = [ "a" ], run = "create",      desc = "Create file / folder" },
  { on = [ "r" ], run = "rename",      desc = "Rename file" },

  # Toggle Hidden Files
  { on = [ "." ], run = "hidden toggle", desc = "Toggle hidden files" }
]
