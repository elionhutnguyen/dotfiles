[manager]
ratio = [1, 3, 4]
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
show_hidden = false
show_symlink = true

[preview]
wrap = "no"
tab_size = 2
max_width = 1200
max_height = 1500
image_filter = "lanczos3"
image_quality = 85

# File Openers
[opener]
edit = [
  { run = 'nvim %s', block = true, desc = "Edit with Neovim" }
]
play = [
  { run = 'mpv %s', orphan = true, desc = "Play with MPV" }
]
pdf = [
  { run = 'sioyek %s', orphan = true, desc = "Open with Sioyek" }
]

# File Rules
[open]
rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "video/*", use = "play" },
  { mime = "audio/*", use = "play" },
  { mime = "application/pdf", use = "pdf" },
  { url = "*.nix", use = "edit" },
  { url = "*.toml", use = "edit" },
  { url = "*.lua", use = "edit" }
]
