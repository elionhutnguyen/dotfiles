# =========================================================
# Model & Provider Configuration
# =========================================================
active_provider: google_gemini
GOOSE_TEMPERATURE: 0.2
GOOSE_TELEMETRY_ENABLED: false
keyring: false

providers:
  google_gemini:
    enabled: true
    model: gemini-3.8-flash
    configured: true

# =========================================================
# Extensions (MCP & Platform Tools)
# =========================================================
extensions:
  # Core System & Development
  developer:
    enabled: true
    type: platform
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    bundled: true

  analyze:
    enabled: true
    type: platform
    name: analyze
    description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
    display_name: Analyze
    bundled: true

  code_execution:
    enabled: true
    type: platform
    name: code_execution
    description: Goose will make extension calls through code execution, saving tokens
    display_name: Code Mode
    bundled: true

  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true

  # Knowledge & Memory
  memory:
    enabled: true
    type: builtin

  fetch:
    enabled: true
    type: builtin

  skills:
    enabled: true
    type: platform
    name: skills
    description: Discover and provide skill instructions from filesystem and builtins
    display_name: Skills
    bundled: true

  summon:
    enabled: true
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true

  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true

  # Disabled to minimize context token overhead
  apps:
    enabled: false
    type: platform
    name: apps
    bundled: true

  scheduler:
    enabled: false
    type: platform
    name: scheduler
    bundled: true

  tom:
    enabled: false
    type: platform
    name: tom
    bundled: true

  summarize:
    enabled: false
    type: platform
    name: summarize
    bundled: true

  chatrecall:
    enabled: false
    type: platform
    name: chatrecall
    bundled: true

# =========================================================
# Session Controls
# =========================================================
session:
  log_level: INFO
  history_limit: 100
