#:schema https://yazi-rs.github.io/schemas/theme.json

[mgr]
cwd = { fg = "#7aa2f7", bold = true }

# Find highlighting
find_keyword  = { fg = "#1a1b26", bg = "#e0af68", bold = true }
find_position = { fg = "#bb9af7", bold = true }

# Hover / Markers
marker_copied   = { fg = "#9ece6a", bg = "#9ece6a" }
marker_cut      = { fg = "#f7768e", bg = "#f7768e" }
marker_marked   = { fg = "#7dcfff", bg = "#7dcfff" }
marker_selected = { fg = "#e0af68", bg = "#e0af68" }
marker_symbol   = "▎"

# Count Badges
count_copied   = { fg = "#1a1b26", bg = "#9ece6a", bold = true }
count_cut      = { fg = "#1a1b26", bg = "#f7768e", bold = true }
count_selected = { fg = "#1a1b26", bg = "#e0af68", bold = true }

# Borders
border_symbol = "│"
border_style  = { fg = "#3b4261" }

[tabs]
active   = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
inactive = { fg = "#a9b1d6", bg = "#24283b" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
normal_alt  = { fg = "#7aa2f7", bg = "#24283b" }
select_main = { fg = "#1a1b26", bg = "#bb9af7", bold = true }
select_alt  = { fg = "#bb9af7", bg = "#24283b" }
unset_main  = { fg = "#1a1b26", bg = "#f7768e", bold = true }
unset_alt   = { fg = "#f7768e", bg = "#24283b" }

[indicator]
parent  = { reversed = true }
current = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
preview = { underline = true }

[status]
overall   = { fg = "#a9b1d6", bg = "#1f2335" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep   = { fg = "#414868" }
perm_type  = { fg = "#7aa2f7" }
perm_read  = { fg = "#e0af68" }
perm_write = { fg = "#f7768e" }
perm_exec  = { fg = "#9ece6a" }

# Progress
progress_normal = { fg = "#9ece6a", bg = "#24283b" }
progress_error  = { fg = "#f7768e", bg = "#24283b" }

[notify]
title_info  = { fg = "#9ece6a", bold = true }
title_warn  = { fg = "#e0af68", bold = true }
title_error = { fg = "#f7768e", bold = true }

[input]
border   = { fg = "#7aa2f7" }
title    = { fg = "#7aa2f7", bold = true }
selected = { reversed = true }
