#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
# 1:3:4 ratio gives 50% width to the preview pane on modern displays
ratio          = [ 1, 3, 4 ]
# Natural sort orders numbers correctly (file1, file2, file10)
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
# Show file size directly beside filenames out of the box
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll", "drag" ]

[preview]
# Wrap long lines in code/documents so nothing is truncated off-screen
wrap            = "yes"
tab_size        = 2
# Crisp rendering for high-DPI/4K screens
max_width       = 1200
max_height      = 1500
cache_dir       = ""
image_delay     = 20
image_filter    = "triangle"
image_quality   = 85
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
edit = [
	{ run = '${EDITOR:-nvim} "$@"', desc = "$EDITOR (Terminal)", for = "unix", block = true },
	{ run = 'hx "$@"',              desc = "Helix",              for = "unix", block = true },
	{ run = 'vim "$@"',             desc = "Vim",                for = "unix", block = true },
	{ run = 'code "$@"',            desc = "VS Code (GUI)",      for = "unix", orphan = true },
	{ run = 'code %s',              desc = "VS Code",            for = "windows", orphan = true },
	{ run = 'code -w %s',           desc = "VS Code (block)",    for = "windows", block = true },
]
play = [
	{ run = 'mpv --force-window "$@"', desc = "mpv",          for = "unix", orphan = true },
	{ run = 'xdg-open %s1',            desc = "Default Video", for = "linux", orphan = true },
	{ run = 'open %s',                 desc = "Default Video", for = "macos" },
	{ run = 'start "" %s1',            desc = "Default Video", for = "windows", orphan = true },
	{ run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show media info", for = "unix" },
]
view = [
	{ run = 'imv "$@"',     desc = "imv (Fast viewer)", for = "unix", orphan = true },
	{ run = 'feh -F "$@"',  desc = "feh (Fullscreen)",   for = "unix", orphan = true },
	{ run = 'xdg-open %s1', desc = "Default Viewer",    for = "linux", orphan = true },
	{ run = 'open %s',      desc = "Default Viewer",    for = "macos" },
]
open = [
	{ run = 'xdg-open "$@"', desc = "System Open", for = "linux" },
	{ run = 'open "$@"',     desc = "System Open", for = "macos" },
	{ run = 'start "" %s1',  desc = "System Open", for = "windows", orphan = true },
]
reveal = [
	{ run = 'xdg-open %d1',         desc = "Reveal directory", for = "linux" },
	{ run = 'open -R %s1',          desc = "Reveal in Finder",  for = "macos" },
	{ run = 'explorer /select,%s1', desc = "Reveal in Explorer", for = "windows", orphan = true },
	{ run = "clear; exiftool %s1; echo 'Press enter to exit'; read _", desc = "Show EXIF", for = "unix", block = true },
]
extract = [
	{ run = 'ya pub extract --list %s', desc = "Extract here (Yazi)" },
	{ run = 'unar "$1"',                desc = "Extract with unar", for = "unix" },
]

[open]
rules = [
	# Directory
	{ mime = "folder/*", use = [ "edit", "open", "reveal" ] },
	# Text & Code
	{ mime = "text/*", use = [ "edit", "reveal" ] },
	{ mime = "application/{json,ndjson,javascript,wine-extension-ini,xml,yaml,toml}", use = [ "edit", "reveal" ] },
	# Images & Media
	{ mime = "image/*", use = [ "view", "open", "reveal" ] },
	{ mime = "{audio,video}/*", use = [ "play", "reveal" ] },
	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },
	# Documents
	{ mime = "application/pdf", use = [ "open", "reveal" ] },
	# Empty file
	{ mime = "inode/empty", use = [ "edit", "reveal" ] },
	# Fallback
	{ url = "*", use = [ "open", "reveal" ] },
]

[tasks]
file_workers     = 4
plugin_workers   = 8
fetch_workers    = 8
preload_workers  = 4
process_workers  = 8
image_alloc      = 536870912  # 512MB
image_bound      = [ 10000, 10000 ]
